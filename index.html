<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deriv Dual-Panel Terminal - Real Automation Bridge</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#050811',
                        panelBg: '#0b1120',
                        cardBg: '#111827',
                        neonGreen: '#10b981',
                        neonRed: '#ef4444',
                        neonBlue: '#38bdf8',
                        neonPurple: '#a855f7'
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #050811; color: #f3f4f6; }
        .font-mono-code { font-family: 'JetBrains Mono', monospace; }
        
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: #050811; }
        ::-webkit-scrollbar-thumb { background: #1f2937; border-radius: 4px; }
        
        .pulse-green { animation: pulseGreen 1.6s infinite; }
        .pulse-red { animation: pulseRed 1.6s infinite; }
        @keyframes pulseGreen {
            0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { box-shadow: 0 0 0 12px rgba(16, 185, 129, 0); }
            100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }
        @keyframes pulseRed {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { box-shadow: 0 0 0 12px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
        
        .flash-emerald { animation: flashG 0.5s ease-out; }
        .flash-rose { animation: flashR 0.5s ease-out; }
        @keyframes flashG { 0% { border-color: #10b981; box-shadow: inset 0 0 25px rgba(16,185,129,0.6); } 100% { border-color: #1f2937; } }
        @keyframes flashR { 0% { border-color: #ef4444; box-shadow: inset 0 0 25px rgba(239,68,68,0.6); } 100% { border-color: #1f2937; } }
    </style>
</head>
<body class="min-h-screen flex flex-col antialiased selection:bg-cyan-500 selection:text-white">

    <!-- TOP HEADER -->
    <header class="bg-slate-950/90 backdrop-blur border-b border-slate-800 sticky top-0 z-40">
        <div class="max-w-[1920px] mx-auto px-4 py-2.5 flex flex-wrap items-center justify-between gap-3">
            <div class="flex items-center space-x-3">
                <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-emerald-500 via-cyan-500 to-rose-500 p-0.5 shadow-lg shadow-cyan-950/50">
                    <div class="w-full h-full bg-slate-950 rounded-[10px] flex items-center justify-center">
                        <i class="fa-solid fa-bolt text-cyan-400 text-sm"></i>
                    </div>
                </div>
                <div>
                    <h1 class="text-sm sm:text-base font-extrabold tracking-tight text-white flex items-center gap-2">
                        DERIV REAL-CLICK AUTOMATED TERMINAL
                        <span class="text-[10px] font-mono px-2 py-0.5 rounded bg-cyan-500/10 text-cyan-400 border border-cyan-500/30">v4.0 DOM-BRIDGE</span>
                    </h1>
                    <p class="text-xs text-slate-400">Direct DOM Click Automation via Tampermonkey Bridge</p>
                </div>
            </div>

            <!-- Bridge Status & Script Modal Trigger -->
            <div class="flex items-center space-x-3">
                <div id="bridge-status-indicator" class="flex items-center space-x-2 bg-slate-900 border border-slate-800 px-3 py-1.5 rounded-lg">
                    <span id="bridge-dot" class="w-2.5 h-2.5 rounded-full bg-amber-500 animate-pulse"></span>
                    <span id="bridge-text" class="text-xs font-mono text-slate-300">BRIDGE: WAITING FOR SCRIPT</span>
                </div>

                <button onclick="openScriptModal()" class="px-3.5 py-1.5 bg-cyan-600 hover:bg-cyan-500 text-white text-xs font-bold rounded-lg border border-cyan-400/30 shadow-lg shadow-cyan-950/50 transition flex items-center gap-1.5">
                    <i class="fa-solid fa-code"></i> Get Tampermonkey Script
                </button>

                <button onclick="emergencyStop()" class="px-3 py-1.5 bg-rose-500/20 hover:bg-rose-600 text-rose-300 hover:text-white text-xs font-bold rounded-lg border border-rose-500/30 transition">
                    <i class="fa-solid fa-power-off"></i> STOP ALL
                </button>
            </div>
        </div>
    </header>

                    <div class="w-8 h-8 rounded-lg bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 flex items-center justify-center font-bold text-sm">
                        <i class="fa-solid fa-arrow-trend-up"></i>
                    </div>
                    <div>

                            LEFT SECTION: OVER 0 TRADER
                            <span class="text-[10px] font-mono font-bold px-1.5 py-0.5 rounded bg-emerald-500/20 text-emerald-400 border border-emerald-500/30">DIGIT 0</span>
                        </h2>
                        <p class="text-[11px] text-slate-400">Clicks <b class="text-emerald-400">Buy Over 0</b> on Vercel DOM when last digit = 0</p>
                    </div>
                </div>

                    <span id="left-dot" class="w-2 h-2 rounded-full bg-slate-500"></span>
                    <span id="left-badge-text">IDLE</span>
                </div>
